date: "2026-10-02"
title: "Host Key Checking for Recreated Containers (docker-local)"
session:
  file: docker-local/inventory-hostkeys/
  status: completed
  attempted:
    - "Resolve the recurring Host key verification failed error for recreated docker-local containers with a stated host-key policy, a seeding playbook, verification and a negative test"
  explored:
    - "When the node images generate host keys (build time vs container start), via the Dockerfiles and docker run --rm ansible-node-debian ls -l /etc/ssh/"
    - "Unknown key (case A) vs changed key (case B), and which one the earlier sessions actually hit"
    - "Default StrictHostKeyChecking=ask without a terminal (ssh_askpass exec failure)"
    - "host_key_checking = False behaviour in case A and case B, including known_hosts contents and the warning visible only at -vvv"
    - "Docker-daemon key retrieval by container name vs ssh-keyscan by address as trust channels"
    - "Shared ~/.ssh/known_hosts vs a per-exercise UserKnownHostsFile; committing it vs .tmp/"
    - "Relative vs absolute UserKnownHostsFile path and the ansible.cfg search order"
    - "hosts: localhost play vs hosts: all with delegate_to: localhost; gather_facts at play start"
    - "check mode, module check_mode support levels, and the check_mode / changed_when task keywords"
    - "Which tasks need SSH (setup) vs run on the controller (delegated tasks, assert action plugin)"
  tried:
    - "inventory.ini and ansible.cfg with no host-key settings (baseline)"
    - "host_key_checking = False in [defaults]"
    - "Recreating containers without ssh-keygen -R so the Debian and Rocky nodes swapped IPs"
    - "ssh_common_args = -o UserKnownHostsFile=~/known_hosts under [defaults]"
    - "host_key_checking = True with ssh_common_args under [ssh_connection], first with a mistyped absolute path, then corrected"
    - "Exec task with container: \"{{ inventory_hostname }}\" and command ssh-keyscan -H {{ ansible_host }}"
    - "Exec task with a returns: stdout argument"
    - "known_hosts task with key: \"{{ inventory_hostname }}\" and no name"
    - "--check --diff run before check_mode: false was added"
    - "assert added as a third task in the gather_facts: false play"
    - "Single play with explicit ansible.builtin.setup (gather_subset distribution) followed by assert"
    - "Negative test: containers recreated with IPs swapped, inventory left stale"
  corrections:
    - "Predicted a recreated container presents a different host key generated when sshd starts; observed six host key files present in a container where sshd never ran, created at image build time, so recreated containers present the same key"
    - "Predicted docker run --rm ansible-node-debian ls -l /etc/ssh/ would list no host keys; observed all six key files"
    - "Predicted UNREACHABLE with ssh_common_args under [defaults] and host_key_checking still False; observed SUCCESS on both hosts, because host_key_checking was still False and ssh_common_args was ignored (~/known_hosts was never created)"
    - "Stated the misplaced ssh_common_args line worked; restated that it had no effect and ssh used ~/.ssh/known_hosts"
    - "Attributed the ssh_askpass message under the new UserKnownHostsFile to case B; corrected to case A (unknown key in the missing file)"
    - "Predicted the known_hosts task would report changed in the negative test; observed ok, because the .4 line already held the Debian key"
    - "During sign-off stated the known_hosts task did not run in the failing case; corrected that it ran and found no difference"
  bugs_found:
    - "ssh_common_args placed under [defaults] was silently ignored; resolved by moving it to [ssh_connection]"
    - "UserKnownHostsFile path mistyped as /workspace/ansible_with_llm/...; resolved"
    - "Exec task used container: \"{{ inventory_hostname }}\" (node1) instead of the real container name; resolved with a container_name host var"
    - "Exec task used ssh-keyscan, which reintroduces trust on first use; replaced with cat of /etc/ssh/ssh_host_ecdsa_key.pub"
    - "Invalid returns: stdout module argument; removed"
    - "known_hosts task missing name and with key set to the hostname only; resolved with name and key built from ansible_host and host_key_result.stdout"
    - "--check run failed with \"object of type 'dict' has no attribute 'stdout'\" because the exec module (check_mode support none) was skipped; resolved with check_mode: false"
    - "assert placed in the gather_facts: false play would read undefined facts; resolved with an explicit setup task before it"
    - "Controller Ansible venv lacked requests needed by community.docker; resolved with pipx inject ansible requests, added to .devcontainer/Dockerfile"
    - "ansible-lint reported syntax-check[unknown-module] because its venv lacked the ansible package; resolved with pipx inject ansible-lint ansible, added to .devcontainer/Dockerfile"
  completed:
