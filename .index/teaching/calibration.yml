# Teaching-approach calibration — see CLAUDE.md "Teaching calibration" and
# .index/schema.yml teaching_calibration. Observable signals only: the user's
# own stated preferences (quoted), counts, and outcomes. Never a judgment of
# the person.
dimensions:
  - name: "step-size"
    variants:
      fine: "one atomic fact or sub-decision per message"
      chunk: "one exercise step per message (a small cluster of related edits plus one prediction), still one question"
    current_default: "chunk"
    trials:
      - session: "orphaned-backup-cleanup-with-find-and-loop-docker-local-debian-rhel"
        variant: "fine"
        signals:
          - "user said: \"your questions are a bit too small steps and to detailed\" and \"I am a bit lost what you ask\""
          - "several answers addressed only the first half of a two-part question"
      - session: "orphaned-backup-cleanup-with-find-and-loop-docker-local-debian-rhel"
        variant: "chunk"
        signals:
          - "user completed multi-edit steps (find, loop, delete, verify assert) between messages without asking for clarification"
          - "predictions for the backup count, the always behaviour on validate failure and the Rocky guard failure were all confirmed"
      - session: "packaging-the-sshd-drop-in-play-as-a-role-docker-local-debian-rhel"
        variant: "chunk"
        signals:
          - "multi-edit steps (role move, two-play restructure, argument_specs, handler relocation) completed between messages with no hint requests"
          - "one syntax question asked mid-step (shape of a role tasks/main.yml) before completing the move"
  - name: "two-part-questions"
    variants:
      single: "one question with one ask"
      two-part: "one question with a 'what' half and a 'why' half"
    current_default: "single"
    trials:
      - session: "orphaned-backup-cleanup-with-find-and-loop-docker-local-debian-rhel"
        variant: "two-part"
        signals:
          - "the second half went unanswered at least five times and needed a follow-up message"
      - session: "packaging-the-sshd-drop-in-play-as-a-role-docker-local-debian-rhel"
        variant: "two-part"
        signals:
          - "several three-part prediction or sign-off questions were answered only in their first part and needed a follow-up"
          - "sign-off part 1 needed splitting; user said: \"oh, it is too detailed question, just render and verify is changed and handlers are executed\""
          - "single-ask questions (roles vs tasks ordering, handler flush point, handler lookup) were answered precisely after at most one restatement"
  - name: "letting-a-failure-happen"
    variants:
      predict-only: "ask for a prediction of the failure and move on"
      observe: "let the user run the failing version and read the real output"
    current_default: "observe"
    trials:
      - session: "orphaned-backup-cleanup-with-find-and-loop-docker-local-debian-rhel"
        variant: "observe"
        signals:
          - "user asked for it: \"I want to see it fails first as my lesson\""
          - "the observed failure (skipped_paths guard on Rocky) was later explained correctly at the mechanism level"
      - session: "packaging-the-sshd-drop-in-play-as-a-role-docker-local-debian-rhel"
        variant: "observe"
        signals:
          - "roles-before-seeding UNREACHABLE on an empty known_hosts was run and then diagnosed correctly (roles run before tasks)"
          - "removed flush_handlers was run; the wait_for timeout and late handler were diagnosed correctly (handlers flush only after the tasks section)"
      - session: "packaging-the-sshd-drop-in-play-as-a-role-docker-local-debian-rhel"
        variant: "predict-only"
        signals:
          - "role vars/ vs defaults/ against group_vars was predicted without running; the prediction matched the documented precedence"
